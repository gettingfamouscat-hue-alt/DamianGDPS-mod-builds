name: Build Android GDPS mods
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RateButton/src/**'
      - 'RateButton/resources/**'
      - 'RateButton/mod.json'
      - 'RateButton/CMakeLists.txt'
      - 'VersusRace/src/**'
      - 'VersusRace/resources/**'
      - 'VersusRace/mod.json'
      - 'VersusRace/CMakeLists.txt'
      - 'PlatformerSaves/**'
      - 'HalfBlockTab/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.project }} - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [RateButton, VersusRace, PlatformerSaves, HalfBlockTab]
        target: [Android64, Android32]
    steps:
      - uses: actions/checkout@v7
      - name: Stage PersistenceAPI dependency
        if: matrix.project == 'PlatformerSaves'
        run: |
          mkdir -p PlatformerSaves/build/geode-deps/sabe.persistenceapi
          curl -fLsS https://github.com/0x5abe/PersistenceAPI/releases/download/v1.2.0/sabe.persistenceapi.geode -o /tmp/sabe.persistenceapi.geode
          unzip -q /tmp/sabe.persistenceapi.geode -d PlatformerSaves/build/geode-deps/sabe.persistenceapi
          echo '{ "required": true }' > PlatformerSaves/build/geode-deps/sabe.persistenceapi/geode-dep-options.json
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: ${{ matrix.project }}
          target: ${{ matrix.target }}
          sdk: given
          use-lto: false
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
