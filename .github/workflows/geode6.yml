name: Build Geode 6 ports
on:
  workflow_dispatch:
    inputs:
      project:
        description: Build scope
        type: choice
        options: [All, RateButton, Staff, Saves, Updater, Client]
        default: All
  push:
    branches: [geode6-22091]
    paths: ['Geode6/**', '.github/workflows/geode6.yml']
permissions:
  contents: read
jobs:
  build:
    name: GD 2.2091 - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: MacOS
            runner: macos-15-intel
          - target: Android64
            runner: ubuntu-latest
          - target: Android32
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: geode-sdk/build-geode-mod@main
        id: build
        continue-on-error: true
        with:
          path: Geode6
          target: ${{ matrix.target }}
          sdk: '6.0.0'
          cli: 'v4.0.2'
          bindings-ref: 962a164c347d7e2104ea2f589fea3fb17b28d25e
          use-lto: false
          configure-args: ${{ inputs.project == 'Client' && '"-DGEODE6_PROJECTS=UpdaterMod;VersusNavigation"' || inputs.project == 'Updater' && '-DGEODE6_PROJECTS=UpdaterMod' || inputs.project == 'RateButton' && '-DGEODE6_PROJECTS=RateButton' || inputs.project == 'Staff' && '"-DGEODE6_PROJECTS=RateButton;MapMod"' || inputs.project == 'Saves' && '"-DGEODE6_PROJECTS=PersistenceAPI;PlatformerSaves"' || '' }}
      - name: Finish build and report remaining errors
        if: steps.build.outcome == 'failure'
        run: cmake --build Geode6/build --parallel 4 -- -k 40
      - name: Check snapshot field coverage
        if: inputs.project != 'RateButton' && inputs.project != 'Staff' && inputs.project != 'Updater' && inputs.project != 'Client'
        run: python3 Geode6/checks/check_snapshot_fields.py Geode6/build/bindings/bindings/Geode/binding
      - name: Test updater installation and rollback
        run: |
          c++ -std=c++20 Geode6/UpdaterMod/tests/transaction.cpp -o "$RUNNER_TEMP/test-updater"
          "$RUNNER_TEMP/test-updater"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Geode6-${{ matrix.target }}
          path: Geode6/build/*/*.geode
          if-no-files-found: error
