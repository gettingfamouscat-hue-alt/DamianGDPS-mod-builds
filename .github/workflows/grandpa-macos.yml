name: Build Grandpa Demon for Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Fetch upstream Grandpa Demon v1.2.3
        run: git clone --depth 1 --branch v1.2.3 https://github.com/UltraSodaa/GrandpaDemon.git GrandpaDemon
      - name: Enable both Mac architectures
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          path = Path('GrandpaDemon/CMakeLists.txt')
          text = path.read_text()
          text = text.replace('set(CMAKE_OSX_ARCHITECTURES "x86_64")', 'set(CMAKE_OSX_ARCHITECTURES "x86_64;arm64")')
          path.write_text(text)
          path = Path('GrandpaDemon/mod.json')
          metadata = json.loads(path.read_text())
          metadata['geode'] = '5.10.1'
          metadata['version'] = 'v1.2.3'
          metadata['gd'] = {platform: '2.2081' for platform in metadata['gd']}
          path.write_text(json.dumps(metadata, indent=2))
          for path in Path('GrandpaDemon/src').rglob('*'):
              if path.suffix not in ('.cpp', '.h'):
                  continue
              source = path.read_text()
              source = re.sub(r'CCARRAY_FOREACH\(([^,]+),\s*(\w+)\)',
                  r'for (auto* \2 : CCArrayExt<CCObject*>(\1))', source)
              path.write_text(source)
          PY
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: GrandpaDemon
          target: MacOS
          sdk: given
          use-lto: false
      - uses: actions/upload-artifact@v7
        with:
          name: GrandpaDemon-macOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
